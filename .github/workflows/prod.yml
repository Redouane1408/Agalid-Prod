name: Production Deployment

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install client deps
        run: npm ci
      - name: Lint client
        run: npm run lint
      - name: Typecheck client
        run: npm run check
      - name: Build server image (validation only)
        run: |
          cd server
          npm ci
          npx prisma generate
          docker build -t agalid-server:latest .

  caddy-validate:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Caddyfile
        run: |
          docker run --rm -v "$PWD/infra/Caddyfile":/etc/caddy/Caddyfile caddy:2 caddy validate --config /etc/caddy/Caddyfile

  deploy:
    needs: [build-and-test, caddy-validate]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Debug Secrets & Connectivity
        env:
          HOST: ${{ secrets.HOST }}
          USERNAME: ${{ secrets.USERNAME }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          PORT: ${{ secrets.PORT || 2222 }}
        run: |
          echo "Checking secrets..."
          [ -z "$HOST" ] && echo "❌ HOST is empty" || echo "✅ HOST is set"
          [ -z "$USERNAME" ] && echo "❌ USERNAME is empty" || echo "✅ USERNAME is set"
          [ -z "$SSH_KEY" ] && echo "❌ SSH_KEY is empty" || echo "✅ SSH_KEY is set"
          
          # Validate SSH Key Format
          if echo "$SSH_KEY" | grep -q "PRIVATE KEY"; then
            echo "✅ SSH_KEY contains 'PRIVATE KEY' header"
          else
            echo "❌ SSH_KEY does not look like a valid private key (missing header)"
          fi
          
          if [ "$(echo "$SSH_KEY" | wc -l)" -lt 2 ]; then
             echo "⚠️ SSH_KEY has only one line. It should be multiline!"
             echo "👉 Action: In GitHub Secrets, ensure you paste the key exactly as it is in the file, including newlines."
          else
             echo "✅ SSH_KEY has multiple lines"
          fi

          echo "Testing connectivity to $HOST:$PORT..."
          if command -v nc >/dev/null 2>&1; then
            for i in {1..5}; do
              echo "Attempt $i: Testing connection to $HOST:$PORT..."
              if nc -zv -w 10 "$HOST" "$PORT"; then
                echo "✅ Connection successful"
                exit 0
              fi
              echo "⏳ Connection failed. Retrying in 10s..."
              sleep 10
            done
            echo "⚠️ Connection failed after 5 attempts. Proceeding anyway to let ssh-action try with longer timeout..."
          else
            echo "⚠️ 'nc' not found, skipping connectivity check"
          fi

      - name: Deploy with Password (sshpass)
        env:
          SSHPASS: ${{ secrets.PASSWORD }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          # 0. Install sshpass
          sudo apt-get update
          sudo apt-get install -y sshpass

          # 1. Prepare Env File
          printf '%s' "${{ secrets.PROD_ENV_FILE }}" > production.env
          python3 - << 'PY'
          import re
          from pathlib import Path

          p = Path("production.env")
          raw = p.read_bytes()
          text = raw.decode("utf-8-sig", errors="replace")
          text = text.replace("\r\n", "\n").replace("\r", "\n")

          cleaned_lines = []
          control_prefix = re.compile(r"^[\u0000-\u001F\u007F-\u009F\u00AD\u200B-\u200F\u202A-\u202E\u2060\uFEFF]+")
          colon_assign = re.compile(r"^([A-Za-z_][A-Za-z0-9_]*)\s*:\s*(.*)$")
          eq_assign = re.compile(r"^([A-Za-z_][A-Za-z0-9_]*)\s*=\s*(.*)$")
          any_assign = re.compile(r"^([^=]+)=(.*)$")
          parsed = {}

          def sanitize_key(raw_key: str) -> str:
            raw_key = raw_key.strip()
            raw_key = re.sub(r"[\u0000-\u001F\u007F-\u009F\u00AD\u200B-\u200F\u202A-\u202E\u2060\uFEFF]", "", raw_key)
            raw_key = re.sub(r"[^A-Za-z0-9_]", "_", raw_key)
            raw_key = re.sub(r"_+", "_", raw_key)
            return raw_key

          for line in text.split("\n"):
            line = line.lstrip()
            line = control_prefix.sub("", line)
            if line.startswith("export "):
              line = line[7:]
            m = colon_assign.match(line)
            if m:
              line = f"{m.group(1)}={m.group(2)}"
            m2 = eq_assign.match(line)
            if m2:
              line = f"{m2.group(1)}={m2.group(2)}"
            else:
              m3 = any_assign.match(line)
              if m3:
                key = sanitize_key(m3.group(1))
                if key:
                  line = f"{key}={m3.group(2)}"
            stripped = line.strip()
            if stripped and not stripped.startswith("#") and ("=" not in line) and (":" not in line):
              cleaned_lines.append(f"# {stripped}")
            else:
              cleaned_lines.append(line)

            m_final = eq_assign.match(line.strip())
            if m_final:
              parsed[m_final.group(1)] = m_final.group(2)

          db_url = parsed.get("DATABASE_URL", "")
          user = parsed.get("POSTGRES_USER") or ""
          db = parsed.get("POSTGRES_DB") or ""
          pwd = parsed.get("POSTGRES_PASSWORD") or ""

          suffix = ""
          if "?" in db_url:
            suffix = "?" + db_url.split("?", 1)[1]
          else:
            suffix = "?schema=public"

          if user and db:
            parsed["DATABASE_URL"] = f"postgresql://{user}:{pwd}@postgres:5432/{db}{suffix}"
            replaced = False
            next_lines = []
            for ln in cleaned_lines:
              if ln.strip().startswith("DATABASE_URL="):
                next_lines.append(f"DATABASE_URL={parsed['DATABASE_URL']}")
                replaced = True
              else:
                next_lines.append(ln)
            if not replaced:
              next_lines.append(f"DATABASE_URL={parsed['DATABASE_URL']}")
            cleaned_lines = next_lines
            print("OK: set DATABASE_URL for docker network (postgres:5432)")
          else:
            if "localhost" in db_url or "127.0.0.1" in db_url or "0.0.0.0" in db_url:
              patched = re.sub(r"@(localhost|127\\.0\\.0\\.1|0\\.0\\.0\\.0):[0-9]+/", "@postgres:5432/", db_url)
              if patched != db_url:
                replaced = False
                next_lines = []
                for ln in cleaned_lines:
                  if ln.strip().startswith("DATABASE_URL="):
                    next_lines.append(f"DATABASE_URL={patched}")
                    replaced = True
                  else:
                    next_lines.append(ln)
                if not replaced:
                  next_lines.append(f"DATABASE_URL={patched}")
                cleaned_lines = next_lines
                print("OK: patched DATABASE_URL host to postgres (kept credentials/db from secret)")

          p.write_text("\n".join(cleaned_lines).rstrip("\n") + "\n", encoding="utf-8")

          bad_lines = []
          for idx, line in enumerate(cleaned_lines, start=1):
            stripped = line.strip()
            if not stripped or stripped.startswith("#"):
              continue
            if not re.match(r"^[A-Za-z_][A-Za-z0-9_]*=", stripped):
              bad_lines.append(idx)

          if bad_lines:
            print(f"ERROR: Invalid production.env format on lines: {', '.join(map(str, bad_lines))}")
            for idx in bad_lines:
              raw = cleaned_lines[idx - 1]
              candidate = re.match(r"^\s*([A-Za-z_][A-Za-z0-9_]*)", raw)
              key = candidate.group(1) if candidate else "<none>"
              has_equal = "=" in raw
              has_colon = ":" in raw
              print(f" - line {idx}: key={key} has_equal={has_equal} has_colon={has_colon}")
            raise SystemExit(1)
          print("OK: production.env format looks valid")
          PY
          
          # 2. Define Variables
          MAX_RETRIES=10
          SSH_HOST="${{ secrets.HOST }}"
          SSH_PORT="${{ secrets.PORT || 2222 }}"
          SSH_USER="${{ secrets.USERNAME }}"
          
          echo "🚀 Starting Deployment with Password (Max Retries: $MAX_RETRIES)"
          
          # 3. Retry Loop
          for ((i=1; i<=MAX_RETRIES; i++)); do
            echo "---------------------------------------------------"
            echo "🔄 Attempt $i/$MAX_RETRIES: Connecting to $SSH_HOST..."
            
            # Step 0: Ensure target directory exists
            echo "📁 Ensuring target directory exists..."
            if sshpass -e ssh -p $SSH_PORT -o ConnectTimeout=30 -o StrictHostKeyChecking=no $SSH_USER@$SSH_HOST "mkdir -p ~/agalid"; then
                echo "✅ Directory ~/agalid verified."
            else
                echo "⚠️ SSH connection failed during mkdir. Waiting 15s..."
                sleep 15
                continue
            fi

            # Step A: Upload env files to temporary paths (we will merge on the server)
            echo "📤 Uploading env files..."
            if sshpass -e ssh -p $SSH_PORT -o ConnectTimeout=30 -o StrictHostKeyChecking=no $SSH_USER@$SSH_HOST "mkdir -p ~/agalid/infra"; then
              echo "✅ Remote infra dir ready."
            else
              echo "⚠️ Failed to ensure remote infra dir. Waiting 15s..."
              sleep 15
              continue
            fi

            if sshpass -e scp -P $SSH_PORT -o ConnectTimeout=30 -o StrictHostKeyChecking=no production.env $SSH_USER@$SSH_HOST:~/agalid/infra/production.env.ci &&
               sshpass -e scp -P $SSH_PORT -o ConnectTimeout=30 -o StrictHostKeyChecking=no production.env $SSH_USER@$SSH_HOST:~/agalid/.env.ci; then
              echo "✅ Env uploaded to temporary files."
            else
              echo "⚠️ Env upload failed. Waiting 15s..."
              sleep 15
              continue
            fi

            # Step B: Run Remote Script
            echo "▶️ Executing remote commands..."
            sshpass -e ssh -p $SSH_PORT -o ConnectTimeout=30 -o StrictHostKeyChecking=no $SSH_USER@$SSH_HOST 'bash -s' << 'EOF'
              set -e
              DEPLOY_SHA='${{ github.sha }}'
              # Ensure directory exists
              mkdir -p ~/agalid
              cd ~/agalid

              if [ -f .env ]; then cp .env /tmp/agalid_env_backup; fi
              if [ -f infra/production.env ]; then cp infra/production.env /tmp/agalid_production_env_backup; fi
              
              # Check for git repo
              if [ ! -d ".git" ]; then
                echo "⚠️ ~/agalid is not a git repository. Initializing and cloning..."

                # Initialize and fetch
                git init
                # Use GITHUB_TOKEN for authentication
                git remote add origin https://oauth2:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
                git fetch --prune origin
                git checkout -B main origin/main
                git branch --set-upstream-to=origin/main main
                echo "✅ Repository initialized successfully."
              else
                echo "📥 Pulling latest changes..."
                # Reset local changes (like permission changes on deploy.sh) to avoid merge conflicts
                git reset --hard HEAD
                git clean -fd -e .env -e infra/production.env
                git fetch --prune origin
                git checkout -f main || git checkout -B main origin/main
                git reset --hard origin/main
              fi

              if [ -f /tmp/agalid_env_backup ]; then mv /tmp/agalid_env_backup .env; fi
              mkdir -p infra
              if [ -f /tmp/agalid_production_env_backup ]; then mv /tmp/agalid_production_env_backup infra/production.env; fi

              merge_env() {
                base_file="$1"
                ci_file="$2"
                out_file="$3"

                cp "$ci_file" "$out_file"

                if [ -f "$base_file" ]; then
                  for key in POSTGRES_USER POSTGRES_PASSWORD POSTGRES_DB DATABASE_URL; do
                    if ! grep -q "^${key}=" "$out_file"; then
                      val="$(grep "^${key}=" "$base_file" | head -n 1 || true)"
                      if [ -n "$val" ]; then
                        echo "$val" >> "$out_file"
                      fi
                    fi
                  done
                fi

                if ! grep -q '^POSTGRES_PASSWORD=' "$out_file"; then
                  echo "ERROR: POSTGRES_PASSWORD is missing in env and no previous value exists on server"
                  exit 1
                fi
                if ! grep -q '^POSTGRES_USER=' "$out_file"; then
                  echo "ERROR: POSTGRES_USER is missing in env and no previous value exists on server"
                  exit 1
                fi
                if ! grep -q '^POSTGRES_DB=' "$out_file"; then
                  echo "ERROR: POSTGRES_DB is missing in env and no previous value exists on server"
                  exit 1
                fi
              }

              if [ -f infra/production.env.ci ]; then
                echo "Merging production env..."
                merge_env "infra/production.env" "infra/production.env.ci" "infra/production.env.merged"
                mv infra/production.env.merged infra/production.env
                rm -f infra/production.env.ci
              fi

              if [ -f .env.ci ]; then
                echo "Merging app env..."
                merge_env ".env" ".env.ci" ".env.merged"
                mv .env.merged .env
                rm -f .env.ci
              fi

              echo "📌 Deploying commit $DEPLOY_SHA"
              git reset --hard "$DEPLOY_SHA"
              git rev-parse --short HEAD
              
              echo "🏗️ Executing deploy.sh..."
              if [ -f "infra/deploy.sh" ]; then
                chmod +x infra/deploy.sh
                # Export SSHPASS so deploy.sh can use it for sudo
                export SSHPASS='${{ secrets.PASSWORD }}'
                export GIT_COMMIT_SHA="$DEPLOY_SHA"
                bash infra/deploy.sh
              else
                echo "❌ Error: infra/deploy.sh not found!"
                exit 1
              fi
              echo "✅ Remote script completed successfully!"

              if docker compose version >/dev/null 2>&1; then
                DC="docker compose"
              elif command -v docker-compose >/dev/null 2>&1; then
                DC="docker-compose"
              else
                echo "❌ Docker Compose not found on server"
                exit 1
              fi

              echo "🔎 Remote verification"
              echo "Commit on server: $(git rev-parse --short HEAD)"
              $DC -f infra/docker-compose.prod.yml ps
              $DC -f infra/docker-compose.prod.yml images

              SERVER_ID=$($DC -f infra/docker-compose.prod.yml ps -q server || true)
              if [ -n "$SERVER_ID" ]; then
                echo "Server container: $SERVER_ID"
                docker inspect -f 'Image={{.Image}} Created={{.Created}}' "$SERVER_ID" || true
                echo "----- server localhost health -----"
                docker exec "$SERVER_ID" sh -lc 'curl -sS -i http://127.0.0.1:4000/health | head -n 60' || true
                echo "----- server localhost health/db -----"
                docker exec "$SERVER_ID" sh -lc 'curl -sS -i http://127.0.0.1:4000/health/db | head -n 60' || true
                echo "----- server logs (tail) -----"
                $DC -f infra/docker-compose.prod.yml logs --tail 200 server || true
              else
                echo "⚠️ No server container found"
              fi

              PROXY_ID=$($DC -f infra/docker-compose.prod.yml ps -q proxy || true)
              if [ -n "$PROXY_ID" ]; then
                echo "Proxy container: $PROXY_ID"
                docker inspect -f 'Image={{.Image}} Created={{.Created}}' "$PROXY_ID" || true
                echo "----- proxy logs (tail) -----"
                $DC -f infra/docker-compose.prod.yml logs --tail 200 proxy || true
              else
                echo "⚠️ No proxy container found"
              fi

              FRONT_ID=$($DC -f infra/docker-compose.prod.yml ps -q frontend || true)
              if [ -n "$FRONT_ID" ]; then
                echo "Frontend container: $FRONT_ID"
                docker inspect -f 'Image={{.Image}} Created={{.Created}}' "$FRONT_ID" || true
                docker exec "$FRONT_ID" sh -lc 'ls -la /usr/share/nginx/html | head -n 50; echo "----- index.html (top) -----"; head -n 30 /usr/share/nginx/html/index.html' || true
              else
                echo "⚠️ No frontend container found"
              fi

              echo "----- localhost headers -----"
              if command -v curl >/dev/null 2>&1; then
                curl -sI http://127.0.0.1/ | head -n 30 || true
                echo "----- localhost html (top) -----"
                curl -s http://127.0.0.1/ | head -n 30 || true
                echo "----- localhost api (headers) -----"
                curl -sI http://127.0.0.1/api/health | head -n 30 || true
                echo "----- localhost api (body top) -----"
                curl -s http://127.0.0.1/api/health | head -n 30 || true
              elif command -v wget >/dev/null 2>&1; then
                wget -qSO- http://127.0.0.1/ 2>&1 | head -n 60 || true
              else
                echo "⚠️ curl/wget not found to verify localhost"
              fi
          EOF
            
            if [ $? -eq 0 ]; then
                echo "🎉 Deployment SUCCESSFUL on attempt $i!"
                exit 0
            else
                echo "⚠️ SSH command failed. Waiting 15s..."
                sleep 15
            fi
          done
          
          echo "❌ FATAL: Deployment failed after $MAX_RETRIES attempts."
          exit 1

      - name: Post-deploy Smoke Test
        env:
          PUBLIC_URL: ${{ secrets.PUBLIC_URL }}
          HOST: ${{ secrets.HOST }}
          HOST_IP: ${{ secrets.HOST_IP }}
        run: |
          set -e
          urls=()
          if [ -n "$PUBLIC_URL" ]; then
            urls+=("${PUBLIC_URL%/}/api/health")
            # Try http fallback if PUBLIC_URL starts with https
            if echo "$PUBLIC_URL" | grep -qi '^https://'; then
              urls+=("http://$(echo "$PUBLIC_URL" | sed -e 's#^https\?://##' -e 's#/$##')/api/health")
            fi
          else
            urls+=("https://agalid.com/api/health")
          fi
          if [ -n "$HOST_IP" ]; then
            urls+=("http://$HOST_IP/api/health")
          fi
          # If HOST looks like IP, also try it
          if echo "$HOST" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$'; then
            urls+=("http://$HOST/api/health")
          fi
          
          echo "🔎 Polling health endpoints:"
          printf ' - %s\n' "${urls[@]}"
          
          for url in "${urls[@]}"; do
            echo "⏳ Checking $url ..."
            for i in {1..20}; do
              STATUS=$(curl -k -L -s -o /dev/null -w "%{http_code}" "$url" || true)
              echo "Attempt $i -> $STATUS"
              if [ "$STATUS" = "200" ]; then
                echo "✅ API health OK at $url"
                exit 0
              fi
              sleep 6
            done
            echo "----- debug: $url (headers) -----"
            curl -k -IL -s "$url" | head -n 40 || true
            echo "----- debug: $url (body top) -----"
            curl -k -L -s "$url" | head -n 40 || true
          done
          echo "❌ No health endpoint responded with 200"
          exit 1

      - name: Post-deploy Frontend Check
        env:
          PUBLIC_URL: ${{ secrets.PUBLIC_URL }}
        run: |
          set -e
          url="${PUBLIC_URL%/}/"
          echo "🔎 Fetching frontend: $url"
          curl -k -sI "$url" | head -n 40 || true
          echo "----- html (top) -----"
          curl -k -s "$url" | head -n 40 || true
